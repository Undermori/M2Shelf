[package]
name = "m2shelf-portable-key-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
autobins = false

[[bin]]
name = "M2ShelfPortableKeyTool"
path = "src/main.rs"

[dependencies]
argon2 = "=0.5.3"
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
m2shelf_lib = { package = "m2shelf", path = "../../src-tauri" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rpassword = "=7.4.0"
semver = "=1.0.26"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = "=1.8.1"
zip = { version = "=4.3.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.60.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "=3.20.0"

[profile.release]
codegen-units = 1
lto = true
panic = "unwind"
strip = true
